<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4 py-8">
  <div class="max-w-md w-full bg-white rounded-lg shadow-md p-6 md:p-8">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold text-blue-600 mb-2">FulfillFlow</h1>
      <p class="text-sm text-gray-600">Warehouse Management System</p>
    </div>
    <h2 class="text-2xl font-bold text-center mb-6">Login</h2>
    <form (ngSubmit)="login()">
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
        <input type="email" [(ngModel)]="credentials.email" name="email" required autocomplete="email"
               class="shadow appearance-none border rounded w-full py-3 px-4 text-gray-700 text-base leading-tight focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-blue-500">
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
        <input type="password" [(ngModel)]="credentials.password" name="password" required autocomplete="current-password"
               class="shadow appearance-none border rounded w-full py-3 px-4 text-gray-700 text-base leading-tight focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-blue-500">
      </div>
      <div *ngIf="error" class="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded text-sm">{{ error }}</div>
      <button type="submit" 
              class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline text-base transition-colors">
        Login
      </button>
    </form>
  </div>
</div>
