<app-navbar></app-navbar>

<div class="container mx-auto p-6">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold">Customers</h1>
    <button (click)="showCreate()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
      + Add Customer
    </button>
  </div>

  <!-- Error Alert -->
  <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
    <p class="font-bold">Error:</p>
    <p>{{ error }}</p>
  </div>

  <!-- Create Customer Form -->
  <div *ngIf="showCreateForm" class="bg-white rounded-lg shadow-md p-6 mb-6">
    <h2 class="text-2xl font-bold mb-4">Create New Customer</h2>
    <form (ngSubmit)="createCustomer()">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-gray-700 text-sm font-bold mb-2">Name *</label>
          <input type="text" [(ngModel)]="newCustomer.name" name="name" required
                 class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
        <div>
          <label class="block text-gray-700 text-sm font-bold mb-2">Email *</label>
          <input type="email" [(ngModel)]="newCustomer.contactEmail" name="contactEmail" required
                 class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
        <div>
          <label class="block text-gray-700 text-sm font-bold mb-2">Phone</label>
          <input type="text" [(ngModel)]="newCustomer.contactPhone" name="contactPhone"
                 class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
        <div>
          <label class="block text-gray-700 text-sm font-bold mb-2">Address</label>
          <input type="text" [(ngModel)]="newCustomer.address" name="address"
                 class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
      </div>
      <div class="mt-4 flex gap-2">
        <button type="submit" [disabled]="loading"
                class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
          Create Customer
        </button>
        <button type="button" (click)="cancelForm()"
                class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded">
          Cancel
        </button>
      </div>
    </form>
  </div>

  <!-- Edit Customer Form -->
  <div *ngIf="showEditForm && editingCustomer" class="bg-white rounded-lg shadow-md p-6 mb-6">
    <h2 class="text-2xl font-bold mb-4">Edit Customer</h2>
    <form (ngSubmit)="updateCustomer()">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-gray-700 text-sm font-bold mb-2">Name *</label>
          <input type="text" [(ngModel)]="editingCustomer.name" name="editName" required
                 class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
        <div>
          <label class="block text-gray-700 text-sm font-bold mb-2">Email *</label>
          <input type="email" [(ngModel)]="editingCustomer.contactEmail" name="editContactEmail" required
                 class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
        <div>
          <label class="block text-gray-700 text-sm font-bold mb-2">Phone</label>
          <input type="text" [(ngModel)]="editingCustomer.contactPhone" name="editContactPhone"
                 class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
        <div>
          <label class="block text-gray-700 text-sm font-bold mb-2">Address</label>
          <input type="text" [(ngModel)]="editingCustomer.address" name="editAddress"
                 class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
      </div>
      <div class="mt-4 flex gap-2">
        <button type="submit" [disabled]="loading"
                class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
          Update Customer
        </button>
        <button type="button" (click)="cancelForm()"
                class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded">
          Cancel
        </button>
      </div>
    </form>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading && !showCreateForm && !showEditForm" class="text-center py-8">
    <p class="text-gray-500">Loading customers...</p>
  </div>

  <!-- Customers Table -->
  <div *ngIf="!loading || showCreateForm || showEditForm" class="bg-white rounded-lg shadow-md overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Phone</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let customer of customers">
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ customer.name }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ customer.contactEmail }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ customer.contactPhone || '-' }}</td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span *ngIf="customer.isActive" class="px-2 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800">Active</span>
            <span *ngIf="!customer.isActive" class="px-2 py-1 text-xs font-semibold rounded-full bg-red-100 text-red-800">Inactive</span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
            <div class="flex gap-2">
              <button (click)="showEdit(customer)"
                      class="text-blue-600 hover:text-blue-900">Edit</button>
              <button (click)="toggleActive(customer)"
                      class="text-yellow-600 hover:text-yellow-900">
                <span *ngIf="customer.isActive">Deactivate</span>
                <span *ngIf="!customer.isActive">Activate</span>
              </button>
              <button (click)="deleteCustomer(customer)"
                      class="text-red-600 hover:text-red-900">Delete</button>
            </div>
          </td>
        </tr>
        <tr *ngIf="customers.length === 0">
          <td colspan="5" class="px-6 py-4 text-center text-gray-500">No customers found. Click "Add Customer" to create one.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
