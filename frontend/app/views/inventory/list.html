<div ng-include="'views/navbar.html'" ng-controller="NavbarCtrl"></div>

<div class="container mx-auto p-6">
  <h1 class="text-3xl font-bold mb-6">Inventory</h1>
  <div class="bg-white rounded-lg shadow-md overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">SKU</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Size</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Color</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Barcode</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr ng-repeat="item in inventoryItems">
          <td class="px-6 py-4 whitespace-nowrap">{{ item.sku }}</td>
          <td class="px-6 py-4 whitespace-nowrap">{{ item.size }}</td>
          <td class="px-6 py-4 whitespace-nowrap">{{ item.color }}</td>
          <td class="px-6 py-4 whitespace-nowrap">{{ item.status }}</td>
          <td class="px-6 py-4 whitespace-nowrap">{{ item.inventoryBarcode }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
