<div ng-include="'views/navbar.html'" ng-controller="NavbarCtrl"></div>

<div class="container mx-auto p-6">
  <h1 class="text-3xl font-bold mb-6">Customers</h1>
  <div class="bg-white rounded-lg shadow-md overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr ng-repeat="customer in customers">
          <td class="px-6 py-4 whitespace-nowrap">{{ customer.name }}</td>
          <td class="px-6 py-4 whitespace-nowrap">{{ customer.contactEmail }}</td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span ng-if="customer.isActive" class="px-2 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800">Active</span>
            <span ng-if="!customer.isActive" class="px-2 py-1 text-xs font-semibold rounded-full bg-red-100 text-red-800">Inactive</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
