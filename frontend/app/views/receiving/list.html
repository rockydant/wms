<div ng-include="'views/navbar.html'" ng-controller="NavbarCtrl"></div>

<div class="container mx-auto p-6">
  <h1 class="text-3xl font-bold mb-6">Purchase Orders</h1>
  <div class="bg-white rounded-lg shadow-md overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">PO Number</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Created</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr ng-repeat="po in purchaseOrders">
          <td class="px-6 py-4 whitespace-nowrap">{{ po.poNumber }}</td>
          <td class="px-6 py-4 whitespace-nowrap">{{ po.status }}</td>
          <td class="px-6 py-4 whitespace-nowrap">{{ po.createdAt | date }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
